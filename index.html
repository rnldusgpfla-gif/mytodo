<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="to-do">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>my to-do list</title>
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: plain single column like a stock tasks app — centered title with search and settings, underline tabs with count pills, compact rows with a square box on the left and a star on the right */
:root{
  --bg:#FFFFFF; --fg:#1F1F1F; --fg-2:#5F6368; --fg-3:#A0A5AB; --line:#E6E8EB; --pill:#E9EBEE; --hover:#F4F6F8;
  --accent:#1F5BD6; --accent-soft:#E8EFFD; --star:#E2352F; --star-soft:#FDECEB; --pink:#FF1F8E; --routine:#12B76A; --routine-soft:#E6F7EF; --warn:#C05A00; --warn-soft:#FFF1E2;
  --scrim:rgba(20,22,26,.38); --sheet:#FFFFFF;
  --f-daily:#1F5BD6; --f-project:#188038; --f-asap:#E8710A; --f-someday:#7B61D1; --f-bucket:#C49000; --f-hold:#80868B;
  --f-c1:#D93F7A; --f-c2:#0F8C9C; --f-c3:#6A7F1E; --f-c4:#A0522D; --f-c5:#3F51B5; --f-c6:#546E7A;
  --lift:0 6px 22px rgba(0,0,0,.16); --fs:16px;
  --n1:#FFF200; --n2:#FF7EB6; --n3:#B4FF2E; --n4:#A6D8FF; --n5:#FFA51F; --n6:#FF6BE8; --n7:#6CFFA8; --n8:#00EEFF; --n9:#FF6B57; --n10:#D94DFF; --n11:#3DFF1A; --n12:#5B9BD1;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --fg:#E8EAED; --fg-2:#9AA0A6; --fg-3:#62676D; --line:#2A2D31; --pill:#2C2F33; --hover:#1D1F22;
  --accent:#8AB4F8; --accent-soft:#1F2A3F; --star:#FF6A62; --star-soft:#3A2220; --pink:#FF5CAD; --routine:#3EE08F; --routine-soft:#173326; --warn:#FFAE66; --warn-soft:#3A2A18;
  --scrim:rgba(0,0,0,.6); --sheet:#1E2023;
  --f-daily:#8AB4F8; --f-project:#5BC27E; --f-asap:#FF9A4D; --f-someday:#A895F0; --f-bucket:#E8BD3A; --f-hold:#9AA0A6;
  --f-c1:#F07AA8; --f-c2:#4CC4D3; --f-c3:#A8C25A; --f-c4:#E09468; --f-c5:#8C9CF0; --f-c6:#93A6B0;
  --lift:0 8px 26px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141517; --fg:#E8EAED; --fg-2:#9AA0A6; --fg-3:#62676D; --line:#2A2D31; --pill:#2C2F33; --hover:#1D1F22;
  --accent:#8AB4F8; --accent-soft:#1F2A3F; --star:#FF6A62; --star-soft:#3A2220; --pink:#FF5CAD; --routine:#3EE08F; --routine-soft:#173326; --warn:#FFAE66; --warn-soft:#3A2A18;
  --scrim:rgba(0,0,0,.6); --sheet:#1E2023;
  --f-daily:#8AB4F8; --f-project:#5BC27E; --f-asap:#FF9A4D; --f-someday:#A895F0; --f-bucket:#E8BD3A; --f-hold:#9AA0A6;
  --f-c1:#F07AA8; --f-c2:#4CC4D3; --f-c3:#A8C25A; --f-c4:#E09468; --f-c5:#8C9CF0; --f-c6:#93A6B0;
  --lift:0 8px 26px rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-fs="s"]{--fs:14.5px} :root[data-fs="l"]{--fs:18px} :root[data-fs="xl"]{--fs:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html.dragging-now, html.dragging-now *{-webkit-user-select:none;user-select:none}

/* header + tabs */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.titlebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:10px 4px}
@media (display-mode: standalone){.titlebar{padding-block:26px 4px}}
.titlebar h1{margin:0;text-align:center;font-size:22px;font-weight:500;letter-spacing:-.01em}
.logo{min-width:0;display:flex;justify-content:center}
.logo img{height:36px;width:auto;max-width:100%;display:block}
.logo .logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .logo-l{display:none} :root:not([data-theme="light"]) .logo .logo-d{display:block}}
:root[data-theme="dark"] .logo .logo-l{display:none} :root[data-theme="dark"] .logo .logo-d{display:block}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 9px 10px;font-size:15px;color:var(--fg-2);display:flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.tab .n{background:var(--pill);color:var(--fg-2);font-size:12px;font-weight:600;border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:1.5px;border-radius:1px;background:var(--accent)}
.tab.today[aria-selected="true"]{color:var(--pink)}
.tab.today[aria-selected="true"]::after{background:var(--pink)}

main{padding-block:4px 120px}

/* section header row */
.shead{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:52px}
.shead h2{margin:0;font-size:18px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;column-gap:8px;min-width:0}
.shead h2 small{font-size:13px;color:var(--fg-3);font-weight:400}
.shead .acts{display:flex;align-items:center;gap:0;flex:none}
.ib{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--fg-2)}
.ib:hover{background:var(--hover)}
.ib svg{width:22px;height:22px}
.txtbtn{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:8px 8px;border-radius:8px;white-space:nowrap}
.pillbtn{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px}

/* task rows */
.tasks{list-style:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0;position:relative}
.tasks > li{display:flex;align-items:center;min-height:44px;padding:0 4px 0 6px;background:var(--bg);position:relative;z-index:1;transition:transform .16s ease;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.tasks > li.dragging{transition:none;z-index:3;box-shadow:var(--lift);border-radius:12px;background:var(--sheet)}
.chk{flex:none;width:44px;height:40px;display:grid;place-items:center;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.box{width:20px;height:20px;border-radius:5px;border:2px solid var(--fg-2);display:grid;place-items:center;transition:background .12s,border-color .12s}
.box svg{width:14px;height:14px;color:var(--bg);opacity:0}
.chk input:checked + .box{background:var(--accent);border-color:var(--accent)}
.chk input:checked + .box svg{opacity:1}
.chk input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.ttl{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 4px;display:flex;flex-direction:column;gap:1px;font-size:var(--fs)}
.ttl .txt{overflow-wrap:anywhere}
.ttl .meta{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}
.ttl .meta .warn{color:var(--star)}
.ttl .meta svg{width:13px;height:13px;vertical-align:-2px}
.mdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:3px}
#sheet-memo{min-height:110px;resize:none;font-family:inherit;line-height:1.55;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;width:100%}
.tnote{flex:0 1 auto;min-width:0;max-width:34%;font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.star{flex:none;width:44px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--fg-3)}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:var(--star)}
span.star svg{fill:currentColor;stroke:none}
li.starred .txt{font-weight:600}
li.done .txt{text-decoration:line-through;color:var(--fg-3)}
li.done .box{border-color:var(--fg-3)}
.due{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:99px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.when{display:inline-block;font-size:12.5px;font-weight:400;color:var(--fg-3);margin-left:7px;vertical-align:1px;white-space:nowrap}
.pbadge{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:99px;margin-left:6px;vertical-align:1px;white-space:nowrap;color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb, var(--c) 13%, transparent)}
.pbadge.neon{background:var(--c);color:#161616;box-shadow:none}
.due.over{background:var(--star-soft);color:var(--star)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.near{background:var(--accent-soft);color:var(--accent)}
.due.far{background:var(--pill);color:var(--fg-2)}
.tasks.preview > li{opacity:.55}
.tasks.preview .box{border-color:var(--fg-3)}

/* swipe-to-move backdrop */
.swipebg{position:absolute;left:0;right:0;z-index:0;display:flex;align-items:center;gap:8px;padding-left:20px;background:var(--pill);color:var(--fg-2);font-weight:600;font-size:14px;transition:background .12s,color .12s}
.swipedel{position:absolute;left:0;right:0;z-index:0;display:flex;justify-content:flex-end;background:var(--star)}
.swipedel button{width:84px;border:0;background:transparent;color:#fff;font-weight:600;font-size:15px}
.swipebg.arm{background:var(--f-daily);color:var(--bg)}
.swipebg svg{width:18px;height:18px}

/* always-empty first row */
li.addrow{touch-action:auto}
li.addrow .box{border-color:var(--fg-3)}
li.addrow input{flex:1;min-width:0;border:0;background:transparent;padding:9px 4px;font-size:max(16px,var(--fs));margin-right:44px}
li.addrow input::placeholder{color:var(--fg-3)}
li.addrow input:focus{outline:none}

.fold{border:0;background:none;width:100%;text-align:left;padding:12px 0;color:var(--fg-2);font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:8px}
.fold svg{width:18px;height:18px;transition:transform .15s}
.fold[aria-expanded="true"] svg{transform:rotate(90deg)}
.hint{color:var(--fg-3);font-size:13px;padding:10px 0 0;margin:0}
.sectlabel{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg-2);padding:10px 0 2px;min-height:36px}
.sectlabel.routine{color:var(--routine)}
.sectlabel .cnt{font-weight:500;color:var(--fg-3);font-variant-numeric:tabular-nums}
.sectlabel.routine{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.box.round{border-radius:50%}
.tasks.routines .chk input:checked + .box{background:var(--routine);border-color:var(--routine)}
.tasks.routines li.done .txt{text-decoration:none;color:var(--fg-3)}
.streak{flex:none;font-size:12px;font-weight:600;color:var(--routine);padding-right:12px;min-width:44px;text-align:right}
.rlink{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:2px}
.rtrack{padding:10px 0 14px;border-bottom:1px solid var(--line)}
.rhead{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.rtitle{border:0;background:none;padding:0;text-align:left;font-size:var(--fs);font-weight:600;color:var(--fg)}
.rnums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--fg-2)}
.rnums b{color:var(--routine);font-weight:700;font-variant-numeric:tabular-nums;margin-right:1px}
.grasswrap{display:flex;gap:6px;overflow-x:auto}
.grassdays{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:9.5px;color:var(--fg-3);line-height:13px}
.grass{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.grass i, .legend i{display:block;width:13px;height:13px;border-radius:3px;background:var(--pill)}
.grass i.on, .legend i.on{background:var(--routine)}
.grass i.off, .legend i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.grass i.wait{background:var(--routine-soft)}
.grass i.none{background:transparent}
.grass i.now{outline:1.5px solid var(--fg);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);padding:12px 0}
.legend i:not(:first-child){margin-left:8px}
.sublabel{font-size:13px;color:var(--fg-3);padding:14px 0 2px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:12px;border-radius:12px;background:var(--star-soft);font-size:14px}
.banner button{flex:none;border:0;border-radius:99px;background:var(--star);color:var(--bg);padding:7px 14px;font-weight:600;font-size:13px}

/* search */
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--pill);border-radius:12px;padding:0 12px}
.search svg{width:20px;height:20px;color:var(--fg-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:16px}
.search input:focus{outline:none}

/* home: drawer list */
.drawers{list-style:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0}
.drawers button{width:100%;border:0;background:none;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));text-align:left;min-height:60px}
.drawers button:hover{background:var(--hover)}
.drawers .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pill)}
.drawers .ic i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.drawers .ic svg{width:20px;height:20px}
.drawers .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.drawers .nm b{font-weight:500;font-size:var(--fs)}
.drawers .nm span{font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawers .ct{font-size:15px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.drawers .chev{display:grid;width:20px;color:var(--fg-3)}
.drawers .addd .ic{background:none;border:1.5px dashed var(--line);color:var(--accent)}
.drawers .addd b{color:var(--accent)}
.drawers{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drawers > li{position:relative;background:var(--bg);transition:transform .16s ease;touch-action:pan-y}
.drawers > li.dragging{transition:none;z-index:3;box-shadow:var(--lift);border-radius:12px;background:var(--sheet)}
.drawers .sep{height:1px;background:var(--line);margin:6px 16px}

.pgroup + .pgroup{border-top:1px solid var(--line)}
.pdot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.pgroup .shead h2{font-size:16px;font-weight:600}

/* record */
.summary{display:flex;gap:18px;flex-wrap:wrap;padding:4px 0 12px;color:var(--fg-2);font-size:14px}
.summary b{color:var(--fg);font-size:20px;font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.day{padding:6px 0 10px}
.day h3{margin:0;padding:12px 0 4px;font-size:14px;font-weight:600;color:var(--fg-2)}
.day ul{list-style:none;margin:0;padding:0}
.day li{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:var(--fs)}
.day li .dot{flex:none;width:18px;height:18px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.day li .dot svg{width:12px;height:12px;color:var(--bg)}
.day li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.day li .tag{flex:none;font-size:12px;color:var(--fg-3)}
.day li.big .t{font-weight:600}
.more{width:100%;border:1px solid var(--line);background:none;border-radius:12px;padding:12px;font-weight:600;font-size:14px;color:var(--fg-2);margin-top:8px}

/* sheet + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:90%;overflow-y:auto;animation:up .2s ease-out;display:flex;flex-direction:column;gap:16px}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto;box-shadow:0 0 0 12px transparent;cursor:grab;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.titlein{display:flex;align-items:center;gap:8px}
.titlein input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:10px 0;font-size:19px}
.titlein input:focus{outline:none;border-bottom-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:13px;color:var(--fg-2)}
.field textarea{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;width:100%;min-height:96px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-datetime-edit{padding:0}
.recordrow + .recordrow{margin-top:-8px}
.recordrow{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.recordrow .ic{width:20px;height:20px;color:var(--fg-2);display:grid}
.recordrow b{font-weight:600;font-size:15px}
.recordrow span.sub{font-size:13px;color:var(--fg-3)}
.recordrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.recordrow .chev{width:20px;color:var(--fg-3);display:grid}
.field input,.field select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c,var(--fg-3))}
.chip.plain::before{display:none}
.chip.fontchip{font-size:16px;padding:7px 14px}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on,var(--bg))}
.chip[aria-pressed="true"]::before{background:var(--on,var(--bg))}
.chip[aria-pressed="true"]::before{background:var(--bg)}
.chip.day{width:40px;justify-content:center;padding:6px 0}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;justify-items:center}
.palette{display:flex;flex-direction:column;gap:8px}
.pallabel{font-size:12px;color:var(--fg-3)}
.customsw{display:flex;align-items:center;gap:12px;position:relative;cursor:pointer;font-size:14px;color:var(--fg-2);padding:4px 0}
.customsw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.customsw .sw{flex:none}
.customsw[aria-pressed="true"] .sw{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--c)}
.pallabel:not(:first-child){margin-top:6px}
.sw{width:38px;height:38px;border-radius:10px;border:0;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--c)}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--pill);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--bg)}
.btn.danger{background:none;color:var(--star);padding-inline:4px}
.btn.quiet{background:none;color:var(--fg-2);padding-inline:4px}
.status{font-size:14px;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.status[data-s="ok"] i{background:var(--f-project)}
.status[data-s="wait"] i{background:var(--f-bucket)}
.modal{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .2s ease-out}
@media (min-width:640px){.scrim{align-items:center}.modal,.sheet{border-radius:18px}}
.modal header{padding:22px 20px 12px}
.modal header h2{font-size:20px;font-weight:600;margin:0;line-height:1.3}
.modal header p{margin:6px 0 0;color:var(--fg-2);font-size:14px}
.modal .body{overflow-y:auto;padding:0 20px;display:flex;flex-direction:column;gap:10px}
.ro{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ro .t{font-weight:600;overflow-wrap:anywhere}
.ro .m{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.ro select,.ro input{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 10px;font-size:14px;width:100%}
.modal footer{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:10px;padding:12px 16px;font-size:14px;display:flex;gap:16px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--lift);white-space:nowrap}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:0;filter:brightness(1.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const WD = ['일','월','화','수','목','금','토'];
const md = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
const mdw = s => `${md(s)} (${WD[parse(s).getDay()]})`;
const rel = s => { const t = today(); if (s===t) return '오늘'; if (s===addDays(t,-1)) return '어제'; if (s===addDays(t,1)) return '내일'; return ''; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function nextDow(from, dow){ let d = from; while (parse(d).getDay() !== dow) d = addDays(d,1); return d; }
const nextMonday = from => addDays(from, 7 - ((parse(from).getDay()+6)%7));
const DAY_DESTS = {today:()=>today(), tomorrow:()=>addDays(today(),1), sat:()=>nextDow(today(),6), nextmon:()=>nextMonday(today())};

/* ---------- repeat rules ---------- */
function ruleMatch(rule, d){
  if (!rule) return false;
  const dt = parse(d), w = dt.getDay();
  if (rule.type==='daily') return true;
  if (rule.type==='weekdays') return w>=1 && w<=5;
  if (rule.type==='weekly') return (rule.days||[]).includes(w);
  if (rule.type==='monthly'){ const last = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); return dt.getDate() === Math.min(rule.dom||1, last); }
  return false;
}
function ruleText(rule){
  if (!rule) return '';
  if (rule.type==='daily') return '매일';
  if (rule.type==='weekdays') return '평일마다';
  if (rule.type==='weekly') return '매주 ' + [1,2,3,4,5,6,0].filter(w=>(rule.days||[]).includes(w)).map(w=>WD[w]).join('·');
  if (rule.type==='monthly') return `매월 ${rule.dom}일`;
  return '';
}
function defaultRule(type, prev, base){
  const d = parse(base || today());
  if (type==='weekly') return {type, days: prev && prev.days && prev.days.length ? prev.days : [d.getDay()]};
  if (type==='monthly') return {type, dom: prev && prev.dom ? prev.dom : d.getDate()};
  return {type};
}

/* ---------- storage ---------- */
function loadLocal(){ try{ const r = localStorage.getItem(LSKEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function saveLocal(){
  if (S.mode!=='local') return;
  try{ localStorage.setItem(LSKEY, JSON.stringify({tasks:[...S.tasks.values()], routines:[...S.routines.values()], projects:S.projects, drawers:S.drawers, meta:S.meta, order:S.order, keywords:S.keywords})); }catch(e){}
}
const pend = new Map(), running = new Set();
function write(key, ref, data){ pend.set(key,{ref,data}); if (!running.has(key)) flush(key); }
async function flush(key){
  running.add(key);
  while (pend.has(key)){
    const {ref,data} = pend.get(key); pend.delete(key);
    const go = () => data===null ? ref.delete() : ref.set(data);
    try{ await go(); }
    catch(e){
      if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); try{ await go(); }catch(_){ toast('저장하지 못했어요. 연결을 확인해 주세요.'); } }
      else if (e && e.code==='quota_exceeded') toast('저장 공간이 가득 찼어요. 끝낸 일을 조금 지워 주세요.');
      else toast('저장하지 못했어요. 잠시 후 다시 해 주세요.');
    }
  }
  running.delete(key);
}
function putTask(t){ S.tasks.set(t.id,t); if (S.mode==='db') write('t:'+t.id, appRef.collection('tasks').doc(t.id), t); else saveLocal(); }
function dropTask(id){ S.tasks.delete(id); if (S.mode==='db') write('t:'+id, appRef.collection('tasks').doc(id), null); else saveLocal(); }
function putRoutine(r){ S.routines.set(r.id,r); if (S.mode==='db') write('r:'+r.id, appRef.collection('routines').doc(r.id), r); else saveLocal(); }
function dropRoutine(id){ S.routines.delete(id); if (S.mode==='db') write('r:'+id, appRef.collection('routines').doc(id), null); else saveLocal(); }
function putApp(){ if (S.mode==='db') write('app', appRef, {projects:S.projects, drawers:S.drawers, meta:S.meta, order:S.order, keywords:S.keywords}); else saveLocal(); }

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='value' || k==='checked' || k==='disabled') el[k] = v;
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat()){ if (c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const findDrawer = id => S.drawers.find(d=>d.id===id);
function info(f){
  let base;
  if (FOLDERS[f]) base = {...FOLDERS[f]};
  else { const d = findDrawer(f); base = d ? {name:d.name, desc:d.desc || '', c:d.c || '--f-c1', custom:true} : {name:'서랍', desc:'', c:'--f-hold'}; }
  const m = S.meta[f];
  if (m){ if (m.name) base.name = m.name; if (m.desc != null) base.desc = m.desc; if (m.c) base.c = m.c; }
  return base;
}
const folderIds = () => {
  const base = [...ORDER, ...S.drawers.map(d=>d.id)];
  const saved = (S.order||[]).filter(id => id!=='daily' && base.includes(id));
  return ['daily', ...saved, ...base.filter(id => id!=='daily' && !saved.includes(id))];  // 오늘 always first
};
const cvar = f => cssc(info(f).c);
const all = () => [...S.tasks.values()].filter(t=>!t.deleted);
const key = t => (t.order ?? t.createdAt ?? 0);
const byKey = (a,b) => key(a)-key(b) || (a.createdAt||0)-(b.createdAt||0);
const projName = id => (S.projects.find(p=>p.id===id)||{}).name || '미분류';
const projExists = id => !!S.projects.find(p=>p.id===id);
function listOf(folder, {date, project} = {}){
  return all().filter(t => t.folder===folder && !t.done &&
    (folder!=='daily' || t.date===date) &&
    (folder!=='project' || (project ? t.project===project : !projExists(t.project))));
}
const topKey = list => list.length ? Math.min(...list.map(key)) - 1 : 0;
const bottomKey = list => list.length ? Math.max(...list.map(key)) + 1 : 0;
function placeLabel(t){
  if (t.folder==='project') return projName(t.project);
  if (t.folder==='daily') return t.date ? (rel(t.date) || md(t.date)) : '오늘';
  return info(t.folder).name;
}

function toast(msg, label, fn){
  const box = document.getElementById('toastbox'); box.innerHTML='';
  const el = h('div',{class:'toast', role:'status'}, h('span',null,msg), label ? h('button',{onclick:()=>{ fn(); box.innerHTML=''; }}, label) : null);
  box.append(el); clearTimeout(toast._t); toast._t = setTimeout(()=>{ if (box.contains(el)) box.innerHTML=''; }, 5000);
}
/* undo: remember the tasks as they were, put them back on tap */
const snap = ids => ids.map(id => [id, S.tasks.has(id) ? {...S.tasks.get(id)} : null]);
function undoToast(msg, before){
  toast(msg, '되돌리기', ()=>{ before.forEach(([id,t])=>{ if (t) putTask(t); else dropTask(id); }); render(); });
}

/* a very short tick: Android uses vibrate; iPhone Safari (iOS 18+) gives a haptic tick when a switch toggles */
const hapLabel = h('label',{class:'sr', 'aria-hidden':'true'}, h('input',{type:'checkbox', switch:true, tabindex:'-1'}));
document.body.append(hapLabel);
function buzz(){
  try{ if (navigator.vibrate && navigator.vibrate(8)) return; }catch(e){}
  try{ hapLabel.click(); }catch(e){}
}

/* ---------- actions ---------- */
function addTask(folder, title, extra={}){
  title = title.trim(); if (!title) return;
  const date = folder==='daily' ? (extra.date || S.viewDate) : null;
  const project = folder==='project' ? (extra.project || null) : null;
  putTask({id:'t'+uid(), title, folder, date, project, star:false, done:false, doneAt:null, carried:0, due:null,
    createdAt:Date.now(), order: bottomKey(listOf(folder,{date,project}))});
  render();
}
function toggleDone(id){
  const t = S.tasks.get(id); if (!t) return;
  const before = snap([id]);
  const done = !t.done;
  const next = {...t, done, doneAt: done ? today() : null};
  if (!done) next.order = topKey(listOf(t.folder,{date:t.date, project:t.project}));
  putTask(next); render();
  if (done) undoToast('완료했어요', before);
}
function toggleStar(id){
  const t = S.tasks.get(id); if (!t) return;
  putTask({...t, star:!t.star});
  const r = t.routine && S.routines.get(t.routine); if (r) putRoutine({...r, star:!t.star});
  render();
}
function moveTask(t, dest, project){
  if (DAY_DESTS[dest]){
    const date = DAY_DESTS[dest]();
    return {...t, folder:'daily', date, order: topKey(listOf('daily',{date}))};
  }
  return {...t, folder:dest, date:null, project: dest==='project' ? project : (t.project || null), order: topKey(listOf(dest,{project}))};
}
function removeTask(id){
  const t = S.tasks.get(id); if (!t) return;
  const before = snap([id]);
  if (t.routine) putTask({...t, deleted:true}); else dropTask(id);
  render(); undoToast('삭제했어요', before);
}
const projColor = id => { const p = S.projects.find(x=>x.id===id); return (p && p.c) || '--f-project'; };
function ensureProject(name, color){
  name = (name||'').trim() || '새 프로젝트';
  const ex = S.projects.find(p=>p.name===name); if (ex) return ex.id;
  const p = {id:'p'+uid(), name, c: color || NEON[S.projects.length % NEON.length], createdAt:Date.now()};
  S.projects = [...S.projects, p]; putApp(); return p.id;
}
function reorder(movedId, prevId, nextId, ids){
  const t = S.tasks.get(movedId); if (!t) return;
  const p = prevId && S.tasks.get(prevId), n = nextId && S.tasks.get(nextId);
  let k;
  if (p && n) k = (key(p)+key(n))/2; else if (p) k = key(p)+1; else if (n) k = key(n)-1; else k = 0;
  if ((p && !(k > key(p))) || (n && !(k < key(n)))){
    ids.forEach((id,i)=>{ const x = S.tasks.get(id); if (x && x.order!==i) putTask({...x, order:i}); });
  } else putTask({...t, order:k});
  render();
}
function swipeToToday(id){
  const t = S.tasks.get(id); if (!t) return;
  const before = snap([id]);
  putTask(moveTask(t, 'today')); render();
  undoToast('오늘 할 일로 꺼냈어요', before);
}
function swipeToNextDay(id){
  const t = S.tasks.get(id); if (!t) return;
  const before = snap([id]);
  const date = addDays(t.date || today(), 1);
  putTask({...t, date, carried:(t.carried||0)+1, order: topKey(listOf('daily',{date}))}); render();
  undoToast(`${rel(date) || md(date)}로 미뤘어요`, before);
}
function overdue(){
  const t = today();
  return all().filter(x => x.folder==='daily' && !x.done && !isRoutineTask(x) && x.date && x.date < t).sort((a,b)=>a.date.localeCompare(b.date) || byKey(a,b));
}
/* put today's copy of each repeating task into today's list (one per day, same id on every device) */
/* items made before routines existed were all 반복 할 일; ones made from the 루틴 flow since then are 루틴 */
const ROUTINE_SINCE = Date.parse('2026-11-07T09:10:00Z');
const kindOf = r => r ? (r.kind || ((r.createdAt||0) >= ROUTINE_SINCE ? 'routine' : 'repeat')) : 'repeat';
const isRoutineTask = t => !!(t && t.routine && (t.rkind || kindOf(S.routines.get(t.routine))) === 'routine');
const repeatsOf = kind => [...S.routines.values()].filter(r=>kindOf(r)===kind);
function ensureRoutines(){
  if (!S.loaded) return;
  const d = today();
  S.routines.forEach(r=>{
    if (r.start && r.start > d) return;
    if (!ruleMatch(r.rule, d)) return;
    if ([...S.tasks.values()].some(t=>t.routine===r.id && t.routineDate===d)) return;
    const kind = kindOf(r);
    // a 반복 할 일 that's still undone (carried over) isn't stacked again
    if (kind==='repeat' && all().some(t=>t.routine===r.id && !t.done)) return;
    putTask({id:`r-${r.id}-${d.replace(/-/g,'')}`, title:r.title, folder:'daily', date:d, routine:r.id, routineDate:d, rkind:kind,
      star:!!r.star, done:false, doneAt:null, carried:0, due:null, createdAt:Date.now(), order: topKey(listOf('daily',{date:d}))});
  });
}

/* ---------- gestures: long-press drag to reorder, swipe right to move ---------- */
let D = null, lastGesture = 0, needRender = false, rendering = false;
function attachGestures(ul, opts){
  ul.addEventListener('pointerdown', e=>{
    const li = e.target.closest('li[data-id]');
    if (!li || li.parentNode!==ul || e.button>0 || e.target.closest('.chk,.star')) return;
    D = {li, ul, opts, x:e.clientX, y:e.clientY, lastX:e.clientX, lastY:e.clientY, sy:window.scrollY, type:e.pointerType, mode:null};
    if (e.pointerType!=='mouse') D.timer = setTimeout(()=>{ if (D && !D.mode) beginDrag(); }, 380);
  });
  ul.addEventListener('contextmenu', e=>{ if (e.target.closest('li[data-id]')) e.preventDefault(); });
}
function beginDrag(){
  if (!D || !document.body.contains(D.li)){ D = null; return; }
  const rows = [...D.ul.children].filter(n => n.dataset && n.dataset.id);
  Object.assign(D, {mode:'drag', rows, idx:rows.indexOf(D.li)});
  D.target = D.idx;
  D.tops = rows.map(r => r.getBoundingClientRect().top + window.scrollY);
  D.hs = rows.map(r => r.offsetHeight); D.h = D.hs[D.idx];
  D.li.classList.add('dragging'); document.documentElement.classList.add('dragging-now');
  buzz(); requestAnimationFrame(autoScroll);
}
function dragMove(){
  const dy = (D.lastY + window.scrollY) - (D.y + D.sy);
  D.li.style.transform = `translateY(${dy}px) scale(1.01)`;
  const center = D.tops[D.idx] + D.h/2 + dy;
  let t = D.idx;
  for (let i=0;i<D.rows.length;i++){
    if (i===D.idx) continue;
    const mid = D.tops[i] + D.hs[i]/2;
    if (i < D.idx && center < mid) t = Math.min(t,i);
    if (i > D.idx && center > mid) t = Math.max(t,i);
  }
  D.rows.forEach((r,i)=>{
    if (i===D.idx) return;
    let s = 0;
    if (i > D.idx && i <= t) s = -D.h; else if (i < D.idx && i >= t) s = D.h;
    r.style.transform = s ? `translateY(${s}px)` : '';
  });
  if (t !== D.target){ D.target = t; buzz(); }
}
function autoScroll(){
  if (!D || D.mode!=='drag') return;
  const y = D.lastY, topEdge = 160, botEdge = window.innerHeight - 80;
  let v = 0;
  if (y < topEdge) v = -Math.ceil((topEdge - y)/8); else if (y > botEdge) v = Math.ceil((y - botEdge)/8);
  if (v){ window.scrollBy(0, v); dragMove(); }
  requestAnimationFrame(autoScroll);
}
const SWIPE_AT = 90;
function beginSwipe(){
  if (!D || !document.body.contains(D.li)){ D = null; return; }
  D.mode = 'swipe'; D.armed = false;
  D.bg = h('div',{class:'swipebg', style:`top:${D.li.offsetTop}px;height:${D.li.offsetHeight}px`}, h('span',{html:ICON.arrow, style:'display:grid'}), D.opts.swipeLabel);
  D.ul.insertBefore(D.bg, D.li);
  D.li.style.transition = 'none';
  document.documentElement.classList.add('dragging-now');
}
function swipeMove(){
  const dx = Math.max(0, D.lastX - D.x);
  D.li.style.transform = `translateX(${dx}px)`;
  const armed = dx > SWIPE_AT;
  if (armed !== D.armed){ D.armed = armed; D.bg.classList.toggle('arm', armed); if (armed) buzz(); }
}
const DEL_W = 84;
let openRow = null;
function closeOpenRow(){
  if (!openRow) return;
  const o = openRow; openRow = null;
  o.li.style.transition = 'transform .18s ease'; o.li.style.transform = '';
  setTimeout(()=>{ o.bg.remove(); o.li.style.transition = ''; if (needRender){ needRender = false; render(); } }, 190);
}
function beginSwipeLeft(){
  if (!D || !document.body.contains(D.li)){ D = null; return; }
  closeOpenRow();
  D.mode = 'swipeL'; D.armed = false;
  const id = D.li.dataset.id;
  D.bg = h('div',{class:'swipedel', style:`top:${D.li.offsetTop}px;height:${D.li.offsetHeight}px`},
    h('button',{type:'button', 'aria-label':'삭제', onclick:()=>{ openRow = null; removeTask(id); }}, '삭제'));
  D.ul.insertBefore(D.bg, D.li);
  D.li.style.transition = 'none';
  document.documentElement.classList.add('dragging-now');
}
function swipeLeftMove(){
  const dx = Math.min(0, D.lastX - D.x);
  const x = dx < -DEL_W ? -DEL_W + (dx + DEL_W) * 0.3 : dx;
  D.li.style.transform = `translateX(${x}px)`;
  const armed = dx < -40;
  if (armed !== D.armed){ D.armed = armed; if (armed) buzz(); }
}
/* any tap outside the delete button closes an open row (and doesn't open the edit sheet) */
document.addEventListener('pointerdown', e=>{
  if (openRow && !e.target.closest('.swipedel')){ if (openRow.li.contains(e.target)) lastGesture = Date.now(); closeOpenRow(); }
}, true);
window.addEventListener('pointermove', e=>{
  if (!D) return;
  D.lastX = e.clientX; D.lastY = e.clientY;
  const dx = e.clientX - D.x, dy = e.clientY - D.y;
  if (!D.mode){
    if (!D.opts.noSwipe && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.3){ clearTimeout(D.timer); if (dx > 0) beginSwipe(); else beginSwipeLeft(); }
    else if (D.type==='mouse'){ if (Math.hypot(dx,dy) > 6) beginDrag(); }
    else if (Math.hypot(dx,dy) > 10){ clearTimeout(D.timer); D = null; }
    return;
  }
  e.preventDefault();
  if (D.mode==='drag') dragMove(); else if (D.mode==='swipeL') swipeLeftMove(); else swipeMove();
});
document.addEventListener('touchmove', e=>{ if (D && D.mode) e.preventDefault(); }, {passive:false});
function endGesture(){
  if (!D) return;
  clearTimeout(D.timer);
  const d = D; D = null;
  if (!d.mode) return;
  lastGesture = Date.now();
  document.documentElement.classList.remove('dragging-now');
  if (d.mode==='swipeL'){
    d.li.style.transition = 'transform .18s ease';
    if (Math.min(0, d.lastX - d.x) < -40){ d.li.style.transform = `translateX(${-DEL_W}px)`; openRow = {li:d.li, bg:d.bg}; }
    else { d.li.style.transform = ''; setTimeout(()=>{ d.bg.remove(); d.li.style.transition = ''; if (needRender){ needRender = false; render(); } }, 190); }
    return;
  }
  if (d.mode==='swipe'){
    d.bg.remove(); d.li.style.transition = ''; d.li.style.transform = '';
    if (Math.max(0, d.lastX - d.x) > SWIPE_AT) d.opts.onSwipe(d.li.dataset.id);
    else if (needRender){ needRender = false; render(); }
    return;
  }
  d.rows.forEach(r => r.style.transform = ''); d.li.classList.remove('dragging');
  if (d.target !== d.idx){
    const ids = d.rows.map(r => r.dataset.id);
    const [m] = ids.splice(d.idx,1); ids.splice(d.target,0,m);
    (d.opts.onReorder || reorder)(m, ids[d.target-1] || null, ids[d.target+1] || null, ids);
  } else if (needRender){ needRender = false; render(); }
}
window.addEventListener('pointerup', endGesture);
window.addEventListener('pointercancel', endGesture);

/* ---------- render ---------- */
function render(){
  if ((D && D.mode) || openRow){ needRender = true; return; }
  needRender = false; rendering = true;
  const a = document.activeElement;
  const keep = a && a.id && a.tagName==='INPUT' && !document.getElementById('layer').contains(a) ? {id:a.id, v:a.value, s:a.selectionStart, e:a.selectionEnd} : null;
  renderTabs();
  const main = document.getElementById('main'); main.innerHTML='';
  const v = S.view;
  if (v==='home') renderHome(main);
  else if (v==='daily') renderDaily(main);
  else if (v==='project') renderProjects(main);
  else if (v==='starred') renderStarred(main);
  else if (v==='routines') renderRoutines(main, 'routine');
  else if (v==='repeats') renderRoutines(main, 'repeat');
  else if (v==='rtrack') renderRoutineTracking(main);
  else if (v==='record') renderRecord(main);
  else if (v==='search') renderSearch(main);
  else if (FOLDERS[v] || findDrawer(v)) renderFolder(main, v);
  else { S.view = 'home'; renderTabs(); renderHome(main); }
  if (keep){ const el = document.getElementById(keep.id); if (el){ el.value = keep.v; el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s, keep.e); }catch(_){} if (el.id.startsWith('add-')) el.scrollIntoView({block:'nearest'}); } }
  rendering = false;
}
function go(view){
  if (view==='tomorrow'){ view = 'daily'; S.viewDate = addDays(today(),1); }
  else if (view==='daily') S.viewDate = today();
  S.view = view;
  render(); window.scrollTo(0,0);
  const sel = document.querySelector('.tab[aria-selected="true"]'); if (sel) sel.scrollIntoView({inline:'nearest', block:'nearest'});
}
function counts(){
  const t = today(), c = {};
  folderIds().forEach(f => c[f] = all().filter(x => x.folder===f && !x.done && !isRoutineTask(x) && (f!=='daily' || x.date===t)).length);
  return c;
}
function renderTabs(){
  const nav = document.getElementById('tabs'); nav.innerHTML='';
  const c = counts();
  const tmr = addDays(today(),1);
  const sel = id => id==='daily' ? (S.view==='daily' && S.viewDate===today())
    : id==='tomorrow' ? (S.view==='daily' && S.viewDate===tmr)
    : S.view===id;
  const tab = (id, label, n) => h('button',{class: id==='daily' ? 'tab today' : 'tab', role:'tab', 'aria-selected':String(sel(id)), onclick:()=>go(id)}, label, n ? h('span',{class:'n'}, n) : null);
  nav.append(tab('daily', info('daily').name, c.daily));
  nav.append(tab('tomorrow', '내일', all().filter(x=>x.folder==='daily' && x.date===tmr && !x.done && !isRoutineTask(x)).length));
  folderIds().filter(f=>f!=='daily').forEach(f => nav.append(tab(f, info(f).name, c[f])));
}

function dueTag(t){
  if (!t.due || t.done) return null;
  const n = diffDays(today(), t.due);
  let label, cls;
  if (n < 0){ label = `${-n}일 지남`; cls = 'over'; }
  else if (n===0){ label = '오늘까지'; cls = 'over'; }
  else if (n===1){ label = '내일까지'; cls = 'soon'; }
  else if (n <= 3){ label = `D-${n}`; cls = 'soon'; }
  else if (n <= 7){ label = `D-${n}`; cls = 'near'; }
  else { label = `${md(t.due)}까지`; cls = 'far'; }
  return h('span',{class:'due '+cls}, label);
}
function projBadge(t, opts){
  if (!t.project || !projExists(t.project) || t.done) return null;
  if (opts.inProject===t.project) return null;               // already inside that project's group
  if (opts.showFolder && t.folder==='project') return null;  // the place label already says it
  const c = projColor(t.project);
  return h('span',{class: isNeon(c) ? 'pbadge neon' : 'pbadge', style:`--c:${cssc(c)}`}, projName(t.project));
}
function taskLi(t, opts={}){
  const meta = [];
  if (opts.showFolder) meta.push(h('span',null, placeLabel(t)));
  const r = t.routine && S.routines.get(t.routine);
  if (r) meta.push(h('span',null, h('span',{html:ICON.repeat}), ' ', ruleText(r.rule)));
  if (t.done && t.doneAt) meta.push(h('span',null, `${md(t.doneAt)} 완료`));
  const cid = 'c-'+t.id;
  return h('li',{'data-id': t.done || opts.still ? null : t.id, class:[t.star&&!t.done?'starred':'', t.done?'done':''].join(' ').trim() || null},
    h('label',{class:'chk', for:cid},
      h('input',{type:'checkbox', id:cid, checked:!!t.done, onchange:()=>toggleDone(t.id), 'aria-label':(t.done?'완료 취소: ':'완료: ')+t.title}),
      h('span',{class:'box', html:ICON.check})),
    h('button',{class:'ttl', onclick:()=>{ if (Date.now()-lastGesture < 400) return; openTaskSheet(t.id); }},
      h('span',{class:'txt'}, t.title, (t.memo||'').trim() ? h('span',{class:'mdot', title:'메모 있음', 'aria-label':'메모 있음'}) : null, projBadge(t, opts), (opts.inProject && t.folder!=='project' && !t.done) ? h('span',{class:'when'}, placeLabel(t)) : null, dueTag(t)), meta.length ? h('span',{class:'meta'}, meta) : null),
    t.note ? h('span',{class:'tnote'}, t.note) : null,
    h('button',{class:'star', 'aria-pressed':String(!!t.star), 'aria-label': t.star ? '중요 표시 해제' : '중요 표시', html:ICON.star, onclick:()=>toggleStar(t.id)}));
}

/* one list: always-empty first row, open tasks (drag + swipe), folded "완료됨" */
function listBlock({id, folder, date, project, items, add=true, liOpts={}}){
  const frag = document.createDocumentFragment();
  const open = items.filter(t=>!t.done).sort(byKey);
  const done = items.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const ul = h('ul',{class:'tasks'});
  let addRow = null;
  if (add){
    const inp = h('input',{id:'add-'+id, type:'text', placeholder:'할 일 추가', autocomplete:'off', enterkeyhint:'enter', 'aria-label':'할 일 추가'});
    const commit = () => { const v = inp.value; if (!v.trim()) return; inp.value=''; addTask(folder, v, {date, project}); };
    inp.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); commit(); } });
    inp.addEventListener('blur', ()=>{ if (!rendering && inp.isConnected && inp.value.trim()) commit(); });
    addRow = h('li',{class:'addrow'}, h('label',{class:'chk', for:inp.id, 'aria-hidden':'true'}, h('span',{class:'box'})), inp);
  }
  open.forEach(t => ul.append(taskLi(t, liOpts)));
  if (addRow) ul.append(addRow);
  const isDaily = folder==='daily';
  attachGestures(ul, {onSwipe: isDaily ? swipeToNextDay : swipeToToday, swipeLabel: isDaily ? '다음 날로' : '오늘로'});
  frag.append(ul);
  if (done.length){
    const k = 'done:'+id, isOpen = S.openDone[k] ?? (folder==='daily');  // today's finished items start unfolded
    frag.append(h('button',{class:'fold', 'aria-expanded':String(isOpen), onclick:()=>{ S.openDone[k] = !isOpen; render(); }},
      h('span',{html:ICON.chev, style:'display:grid'}), `완료됨 (${done.length})`));
    if (isOpen){ const du = h('ul',{class:'tasks'}); done.forEach(t=>du.append(taskLi(t, liOpts))); frag.append(du); }
  }
  return frag;
}

/* routines: show up on their days, never carried over, tracked by day */
function routinesOn(d){
  return repeatsOf('routine').filter(r => (!r.start || r.start <= d) && ruleMatch(r.rule, d)).sort((a,b)=>(a.order ?? a.createdAt ?? 0)-(b.order ?? b.createdAt ?? 0));
}
function renderRoutineSection(main, d){
  const inst = all().filter(t=>isRoutineTask(t) && t.routineDate===d);
  const byR = new Map(inst.map(t=>[t.routine, t]));
  const rows = [];
  // today or earlier: the day's own entries; later days: what will come in
  const list = d <= today() ? [...inst.map(t=>S.routines.get(t.routine)).filter(Boolean), ...inst.filter(t=>!S.routines.get(t.routine)).map(t=>({id:t.routine, title:t.title, rule:null, gone:true}))]
                            : routinesOn(d);
  const seen = new Set();
  list.forEach(r=>{ if (seen.has(r.id)) return; seen.add(r.id); rows.push(r); });
  const doneN = rows.filter(r=>byR.get(r.id)?.done).length;
  const ul = h('ul',{class:'tasks routines' + (d > today() ? ' preview' : '')});
  rows.forEach(r=>{
    const t = byR.get(r.id);
    const cid = 'rc-'+r.id+'-'+d;
    ul.append(h('li',{class: t && t.done ? 'done' : null},
      t ? h('label',{class:'chk', for:cid},
            h('input',{type:'checkbox', id:cid, checked:!!t.done, onchange:()=>toggleDone(t.id), 'aria-label':(t.done?'완료 취소: ':'완료: ')+r.title}),
            h('span',{class:'box round', html:ICON.check}))
        : h('span',{class:'chk'}, h('span',{class:'box round'})),
      h('button',{class:'ttl', onclick:()=>{ if (!r.gone) openRoutineSheet(r.id); }},
        h('span',{class:'txt'}, r.title, r.rule ? h('span',{class:'when'}, ruleText(r.rule)) : null)),
      h('span',{class:'streak'}, streakOf(r.id, d) >= 2 ? `${streakOf(r.id, d)}일째` : '')));
  });
  main.append(h('div',{class:'sectlabel routine'}, h('button',{class:'rlink', onclick:()=>go('rtrack'), 'aria-label':'루틴 트래킹 보기'}, '루틴', h('span',{html:ICON.chev, style:'display:grid;width:14px'})),
    rows.length && d <= today() ? h('span',{class:'cnt'}, `${doneN}/${rows.length}`) : null,
    h('button',{class:'txtbtn', style:'margin-left:auto;color:var(--routine)', onclick:openNewRoutine}, '+ 루틴')));
  if (rows.length) main.append(ul);
  else main.append(h('p',{class:'hint', style:'padding:0 0 4px'}, repeatsOf('routine').length ? '이날은 루틴이 없어요.' : '매일 하는 습관을 루틴으로 만들어 보세요.'));
}
/* consecutive scheduled days done, counting back from d (days the routine isn't scheduled are skipped) */
function streakOf(rid, d){
  const r = S.routines.get(rid); if (!r) return 0;
  const done = new Set(all().filter(t=>t.routine===rid && t.done).map(t=>t.routineDate));
  let n = 0, cur = d;
  if (!done.has(cur)) cur = addDays(cur, -1);   // today not done yet doesn't break it
  for (let i=0; i<400; i++){
    if (r.start && cur < r.start) break;
    if (ruleMatch(r.rule, cur)){ if (done.has(cur)) n++; else break; }
    cur = addDays(cur, -1);
  }
  return n;
}
function routineStats(r){
  const t = today();
  const done = new Set(all().filter(x=>x.routine===r.id && x.done).map(x=>x.routineDate));
  const start = r.start || [...done].sort()[0] || t;
  let best = 0, run = 0;
  for (let d = start, i = 0; d <= t && i < 1500; d = addDays(d,1), i++){
    if (!ruleMatch(r.rule, d)) continue;
    if (done.has(d)) { run++; best = Math.max(best, run); }
    else if (d !== t) run = 0;          // today not done yet doesn't break it
  }
  const m0 = t.slice(0,8) + '01';
  let sched = 0, hit = 0;
  for (let d = (start > m0 ? start : m0); d <= t; d = addDays(d,1)){
    if (!ruleMatch(r.rule, d)) continue;
    if (done.has(d)) { sched++; hit++; } else if (d !== t) sched++;
  }
  return {done, start, best, streak: streakOf(r.id, t), rate: sched ? Math.round(hit/sched*100) : null};
}
function renderRoutineTracking(main){
  main.append(h('div',{class:'shead'}, h('h2',null,'루틴 트래킹'),
    h('div',{class:'acts'}, h('button',{class:'txtbtn', style:'color:var(--routine)', onclick:()=>go('routines')}, '루틴 관리'))));
  const list = repeatsOf('routine').sort((a,b)=>(a.order ?? a.createdAt ?? 0)-(b.order ?? b.createdAt ?? 0));
  if (!list.length){ main.append(h('p',{class:'hint'}, '아직 루틴이 없어요. 오늘 화면의 + 루틴으로 만들어 보세요.')); return; }
  const t = today(), end = parse(t);
  list.forEach(r=>{
    const st = routineStats(r);
    // as many weeks as the routine has existed (6 to 18), Monday-first columns
    const weeks = Math.max(6, Math.min(18, Math.ceil((diffDays(st.start, t) + ((end.getDay()+6)%7) + 1) / 7)));
    const startD = new Date(end); startD.setDate(end.getDate() - ((end.getDay()+6)%7) - (weeks-1)*7);
    const grid = h('div',{class:'grass', role:'img', 'aria-label':`${r.title} 최근 ${weeks}주 기록`});
    for (let i=0; i<weeks*7; i++){
      const d = new Date(startD); d.setDate(startD.getDate()+i); const ds = ymd(d);
      let cls = '';
      if (ds > t || ds < st.start) cls = 'none';
      else if (!ruleMatch(r.rule, ds)) cls = 'off';
      else if (st.done.has(ds)) cls = 'on';
      else if (ds === t) cls = 'wait';
      grid.append(h('i',{class: cls + (ds===t ? ' now' : ''), title:`${md(ds)}${cls==='on'?' · 함':cls==='off'?' · 쉬는 날':cls==='wait'?' · 아직':cls==='none'?'':' · 안 함'}`}));
    }
    main.append(h('section',{class:'rtrack'},
      h('div',{class:'rhead'},
        h('button',{class:'rtitle', onclick:()=>openRoutineSheet(r.id)}, r.title, h('span',{class:'when'}, ruleText(r.rule))),
        h('div',{class:'rnums'},
          h('span',null, h('b',null, st.streak), '일 연속'),
          h('span',null, '최고 ', h('b',null, st.best), '일'),
          h('span',null, '이번 달 ', h('b',null, st.rate==null ? '-' : st.rate + '%')))),
      h('div',{class:'grasswrap'}, h('div',{class:'grassdays', 'aria-hidden':'true'}, ['월','','수','','금','','일'].map(x=>h('span',null,x))), grid)));
  });
  main.append(h('div',{class:'legend'}, h('i',{class:'on'}), '함', h('i'), '안 함', h('i',{class:'off'}), '쉬는 날'));
}
function openNewRoutine(){
  const name = h('input',{id:'newroutine-name', type:'text', placeholder:'예: 영양제 먹기, 스트레칭 10분', 'aria-label':'루틴 이름'});
  const make = () => {
    const v = name.value.trim(); if (!v){ name.focus(); return; }
    const r = {id:'r'+uid(), kind:'routine', title:v, star:false, rule:{type:'daily'}, start:today(), createdAt:Date.now()};
    putRoutine(r); closeLayer(); ensureRoutines(); render(); openRoutineSheet(r.id);
  };
  name.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); make(); } });
  openLayer(h('div',{class:'sheet', role:'dialog', 'aria-modal':'true', 'aria-label':'새 루틴'},
    h('div',{class:'grab'}), h('label',{class:'field'}, h('span',null,'새 루틴'), name),
    h('p',{class:'hint', style:'padding:0'}, '루틴은 정한 날마다 할 일 아래 루틴 칸에 나와요. 못 해도 다음 날로 넘어가지 않아요.'),
    h('div',{class:'row'}, h('button',{class:'btn', type:'button', onclick:closeLayer}, '취소'), h('button',{class:'btn pri', type:'button', onclick:make}, '다음'))),
    null, ()=>{ if (name.value.trim()) make(); else closeLayer(); });
  setTimeout(()=>name.focus(), 50);
}

/* --- record --- */
function renderRecord(main){
  const done = all().filter(t=>t.done && t.doneAt);
  const byDay = new Map();
  done.forEach(t=>{ if (!byDay.has(t.doneAt)) byDay.set(t.doneAt, []); byDay.get(t.doneAt).push(t); });
  const t = today();
  let streak = 0, cur = byDay.has(t) ? t : addDays(t,-1);
  while (byDay.has(cur)){ streak++; cur = addDays(cur,-1); }
  main.append(h('div',{class:'shead'}, h('h2',null,'기록')));
  main.append(h('div',{class:'summary'},
    h('span',null, h('b',null, done.filter(x=>x.doneAt.startsWith(t.slice(0,7))).length), `${parse(t).getMonth()+1}월에 끝냄`),
    h('span',null, h('b',null, streak), '일 연속'),
    h('span',null, h('b',null, done.length), '전체')));
  const dates = [...byDay.keys()].sort().reverse();
  if (!dates.length){ main.append(h('p',{class:'hint'}, '할 일을 체크하면 끝낸 날짜별로 여기에 쌓여요.')); return; }
  dates.slice(0, S.recCount).forEach(d=>{
    const r = rel(d);
    main.append(h('section',{class:'day'}, h('h3',null, mdw(d) + (r ? ` · ${r}` : '')),
      h('ul',null, byDay.get(d).sort(byKey).map(x=>h('li',{class: x.folder==='bucket' ? 'big' : null},

  if (dates.length > S.recCount) main.append(h('button',{class:'more', onclick:()=>{ S.recCount += 30; render(); }}, '이전 기록 더 보기'));
}

/* ---------- overlays ---------- */
let lastFocus = null;
function openLayer(node, beforeClose, pullSave){
  lastFocus = document.activeElement;
  const layer = document.getElementById('layer'); layer.innerHTML='';
  layer._beforeClose = beforeClose || null;
  const scrim = h('div',{class:'scrim', onclick:e=>{ if (e.target===scrim) closeLayer(); }}, node);
  layer.append(scrim);
  enablePullDown(node, pullSave);
}
function enablePullDown(node, pullSave){
  let sy = 0, sx = 0, dy = 0, active = false, dragging = false;
  const scrolledAbove = el => { for (; el && el !== node.parentNode; el = el.parentElement) if (el.scrollTop > 0) return true; return false; };
  const start = (y, x, target) => { if (scrolledAbove(target)) return; sy = y; sx = x; dy = 0; active = true; dragging = false; };
  const move = (y, x, e) => {
    if (!active) return;
    const d = y - sy, ddx = x - sx;
    if (!dragging){
      if (d > 8 && d > Math.abs(ddx) * 1.2){ dragging = true; node.style.animation = 'none'; node.style.transition = 'none'; }
      else if (d < -4 || Math.abs(ddx) > 10){ active = false; return; }
      else return;
    }
    if (e.cancelable) e.preventDefault();
    dy = Math.max(0, d);
    node.style.transform = `translateY(${dy}px)`;
  };
  const end = () => {
    if (!active) return; active = false;
    if (!dragging) return;
    node.style.transition = 'transform .18s ease';
    if (dy > Math.min(110, node.offsetHeight * 0.22)){
      node.style.transform = `translateY(${node.offsetHeight}px)`;
      lastGesture = Date.now();
      setTimeout(()=>{
        if (pullSave) pullSave(); else closeLayer();
        if (node.isConnected) node.style.transform = '';   // stayed open (e.g. a name is still missing)
      }, 170);
    } else node.style.transform = '';
  };
  node.addEventListener('touchstart', e=>start(e.touches[0].clientY, e.touches[0].clientX, e.target), {passive:true});
  node.addEventListener('touchmove', e=>move(e.touches[0].clientY, e.touches[0].clientX, e), {passive:false});
  node.addEventListener('touchend', end); node.addEventListener('touchcancel', end);
  node.addEventListener('mousedown', e=>{
    if (!e.target.closest('.grab')) return;
    start(e.clientY, e.clientX, e.target);
    const mm = ev => move(ev.clientY, ev.clientX, ev);
    const mu = () => { end(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
}
function closeLayer(){
  const layer = document.getElementById('layer');
  if (layer._beforeClose){ const f = layer._beforeClose; layer._beforeClose = null; f(); }
  layer.innerHTML=''; render();
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && document.getElementById('layer').firstChild) closeLayer(); });

const dests = () => [['today','오늘',info('daily').c],['tomorrow','내일',info('daily').c],['sat','이번 주 토요일',info('daily').c],['nextmon','다음 주 월요일',info('daily').c], ...folderIds().filter(f=>f!=='daily').map(f=>[f, info(f).name, info(f).c])];

}

function importBackup(text){
  let d;
  try{ d = JSON.parse(text.trim()); }catch(e){ return '백업 내용이 올바르지 않아요. 복사한 글 전체를 붙여넣어 주세요.'; }
  if (!d || !Array.isArray(d.tasks)) return '백업 내용이 올바르지 않아요. 복사한 글 전체를 붙여넣어 주세요.';
  d.tasks.forEach(t=>{ if (t && t.id) putTask(t); });
  (d.routines||[]).forEach(r=>{ if (r && r.id) putRoutine(r); });
  const byId = (a,b) => { const m = new Map(a.map(x=>[x.id,x])); (b||[]).forEach(x=>{ if (x && x.id && !m.has(x.id)) m.set(x.id,x); }); return [...m.values()]; };
  S.projects = byId(S.projects, d.projects); S.drawers = byId(S.drawers, d.drawers); S.meta = {...(d.meta||{}), ...S.meta};
  putApp(); ensureRoutines();
  return null;
}

function openRollover(){
  const items = overdue(); if (!items.length) return;
  S.rolloverShown = true;
  const choice = new Map(items.map(t=>[t.id, {dest:'today', project: S.projects[0]?.id || '__new', newName:''}]));
  const body = h('div',{class:'body'});
  const opts = () => [['today','오늘',info('daily').c], ...folderIds().filter(f=>f!=='daily').map(f=>[f, info(f).name, info(f).c]), ['delete','지우기','--star']];
  const drawBody = () => {
    body.innerHTML='';
    items.forEach(t=>{
      const c = choice.get(t.id);
      const box = h('div',{class:'ro'},
        h('div',null, h('div',{class:'t'}, t.star ? '★ '+t.title : t.title, dueTag(t)),
          h('div',{class:'m'}, `${mdw(t.date)} 할 일`)),
        h('div',{class:'chips'}, opts().map(([k,l,col])=>h('button',{type:'button', class:'chip', style:cstyle(col), 'aria-pressed':String(c.dest===k), onclick:()=>{ c.dest=k; drawBody(); }}, l))));
      if (c.dest==='project'){
        const sel = h('select',{id:'ro-p-'+t.id, 'aria-label':'프로젝트 고르기'}, S.projects.map(p=>h('option',{value:p.id}, p.name)), h('option',{value:'__new'}, '+ 새 프로젝트'));
        sel.value = c.project; sel.addEventListener('change', ()=>{ c.project = sel.value; drawBody(); });
        box.append(sel);
        if (c.project==='__new'){ const ni = h('input',{id:'ro-n-'+t.id, type:'text', placeholder:'새 프로젝트 이름', value:c.newName}); ni.addEventListener('input', ()=>{ c.newName = ni.value; }); box.append(ni); }
      }
      body.append(box);
    });
  };
  drawBody();
  const setAll = k => { choice.forEach(c=>c.dest=k); drawBody(); };
  openLayer(h('div',{class:'modal', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'ro-h'},
    h('header',null,
      h('h2',{id:'ro-h'}, `못 끝낸 일 ${items.length}개, 어디로 보낼까요?`),
      h('p',null,'고르지 않으면 모두 오늘로 옮겨요.'),
      h('div',{class:'chips', style:'margin-top:12px'},
        h('button',{type:'button', class:'chip', style:cstyle(info('daily').c), onclick:()=>setAll('today')}, '모두 오늘'),
        h('button',{type:'button', class:'chip', style:cstyle(info('someday').c), onclick:()=>setAll('someday')}, `모두 ${info('someday').name}`),
        h('button',{type:'button', class:'chip', style:cstyle(info('hold').c), onclick:()=>setAll('hold')}, `모두 ${info('hold').name}`))),
    body,
    h('footer',null,
      h('button',{class:'btn', type:'button', onclick:closeLayer}, '나중에'),
      h('button',{class:'btn pri', type:'button', onclick:()=>{
        const before = snap(items.map(t=>t.id));
        const newIds = {}; let moved = 0, removed = 0;
        items.forEach(t=>{
          const c = choice.get(t.id), cur = S.tasks.get(t.id); if (!cur) return;
          if (c.dest==='delete'){ dropTask(t.id); removed++; return; }
          if (c.dest==='today'){ putTask({...cur, date:today(), carried:(cur.carried||0)+1}); moved++; return; }
          let pid = null;
          if (c.dest==='project'){
            if (c.project==='__new'){ const nm = (c.newName||'').trim() || '새 프로젝트'; pid = newIds[nm] || (newIds[nm] = ensureProject(nm)); }
            else pid = c.project;
          }
          putTask(moveTask(cur, c.dest, pid)); moved++;
        });
        closeLayer();
        undoToast(`${moved}개를 옮겼어요` + (removed ? `, ${removed}개를 지웠어요` : ''), before);
      }}, '재배치하기'))));

function applyLocal(d){

  S.projects = d.projects || []; S.drawers = d.drawers || []; S.meta = d.meta || {}; S.order = d.order || []; S.keywords = d.keywords || ['이동중','집에서','회사에서'];

let staleWhileTyping = false;
const typingInMain = () => { const a = document.activeElement; return a && a.tagName==='INPUT' && document.getElementById('main').contains(a); };
const rerender = () => {
  if (document.getElementById('layer').firstChild){ renderTabs(); return; }

  render();
};
document.getElementById('main').addEventListener('focusout', ()=>{ if (staleWhileTyping){ staleWhileTyping = false; setTimeout(()=>{ if (!typingInMain() && !document.getElementById('layer').firstChild) render(); else staleWhileTyping = true; }, 0); } });
async function connect(){
  if (!window.claude || !window.claude.use) return useLocal();
  let db = null, user = null;
  try{ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  const id = user ? await user.id().catch(()=>null) : null;
  if (!db || !id) return useLocal();
  appRef = db.doc('data/users/' + id + '/app');
  S.mode = 'db'; setSync('wait');
  let gotTasks = false, gotApp = false, gotRoutines = false, migrated = false;
  const timer = setTimeout(()=>{ if (!gotTasks) toast('저장소 연결이 늦어지고 있어요. 잠시 후 다시 열어 주세요.'); }, 10000);
  const ready = () => { if (gotTasks && gotApp && gotRoutines && !S.loaded){ S.loaded = true; clearTimeout(timer); setSync('ok'); ensureRoutines(); rerender(); maybeRollover(); } };

  appRef.collection('tasks').onSnapshot(snapq=>{
    const m = new Map(snapq.docs.map(d=>[d.id, {...d.data(), id:d.id}]));
    pend.forEach((v,k)=>{ if (k.startsWith('t:')){ const tid = k.slice(2); if (v.data===null) m.delete(tid); else m.set(tid, v.data); } });
    S.tasks = m;
    if (!snapq.metadata.fromCache && !gotTasks){
      gotTasks = true;
      if (snapq.empty && local && (local.tasks||[]).length && !migrated){
        migrated = true;
        local.tasks.forEach(t=>putTask(t));
        (local.routines||[]).forEach(r=>putRoutine(r));
        S.projects = local.projects || []; S.drawers = local.drawers || []; S.meta = local.meta || {}; S.order = local.order || []; S.keywords = local.keywords || ['이동중','집에서','회사에서']; putApp();
      }
    }
    rerender(); ready();
  }, ()=>{ clearTimeout(timer); setSync('err'); });

  appRef.collection('routines').onSnapshot(snapq=>{
    const m = new Map(snapq.docs.map(d=>[d.id, {...d.data(), id:d.id}]));
    pend.forEach((v,k)=>{ if (k.startsWith('r:')){ const rid = k.slice(2); if (v.data===null) m.delete(rid); else m.set(rid, v.data); } });
    S.routines = m;
    if (!snapq.metadata.fromCache) gotRoutines = true;
    rerender(); ready();
  }, ()=>{ gotRoutines = true; ready(); });

  appRef.onSnapshot(s=>{
    if (!pend.has('app') && !(migrated && !s.exists)){
      const d = s.exists ? s.data() : {};
      S.projects = d.projects || []; S.drawers = d.drawers || []; S.meta = d.meta || {}; S.order = d.order || []; S.keywords = d.keywords || ['이동중','집에서','회사에서'];
    }
    if (!s.metadata.fromCache) gotApp = true;
    rerender(); ready();
  }, ()=>{ gotApp = true; ready(); });
}
function useLocal(){ S.mode = 'local'; S.loaded = true; setSync('local'); ensureRoutines(); render(); maybeRollover(); }
connect();
})();
</script>
